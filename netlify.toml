[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for client-side routes like /worker or /admin
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Make sure browsers always pick up the latest service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
